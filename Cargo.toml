[workspace]
members = ["crates/things-mcp"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.1"
authors = ["Richard Lyon"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/richardjlyon/things-mcp"
homepage = "https://github.com/richardjlyon/things-mcp"
description = "Local-first MCP server bridging Claude to Things 3 on macOS — 29 tools for read, search, write, and tag CRUD."
keywords = ["mcp", "things", "claude", "productivity", "macos"]
categories = ["command-line-utilities", "api-bindings"]
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
insta = "1"
rand = "0.10"
rmcp = { version = "1.7", features = ["server","macros","schemars","transport-io","transport-streamable-http-server"] }
rusqlite = { version = "0.39", features = ["bundled","backup"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["auth","trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","fmt"] }
tempfile = "3"
async-trait = "0.1"
urlencoding = "2"
